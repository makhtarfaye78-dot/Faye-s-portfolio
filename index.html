  .doc-card.static { cursor:default; }

  @media (prefers-reduced-motion: reduce) { html { scroll-behavior:auto; } .scroll-cue .line::after { animation:none; } .doc-card, .btn-learn, .cta { transition:none; } }
</style>

  function safeGet() { try { return localStorage.getItem('lang'); } catch (e) { return null; } }
  function safeSet(v) { try { localStorage.setItem('lang', v); } catch (e) {} }
  function setLang(lang) {
    if (!I18N[lang]) lang = 'fr';
    const d = I18N[lang];
    document.documentElement.lang = lang;
    document.title = d.doc_title;
    const cv = document.getElementById('cvLink');
    if (cv) cv.setAttribute('href', 'cv-makhtar-faye-' + lang + '.pdf');
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const v = d[el.getAttribute('data-i18n')];
      if (v !== undefined) el.textContent = v;
    });
    document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    safeSet(lang);
  }
  document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
  const saved = safeGet();
  const initial = saved || ((navigator.language || 'fr').toLowerCase().startsWith('fr') ? 'fr' : 'en');
  setLang(initial);
})();

(function () {
  if (typeof THREE === 'undefined') return; // CDN unreachable: site still works without the 3D head
  const canvas = document.getElementById('figureCanvas');
  const stage = document.getElementById('stage3d');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
  camera.position.set(0, 0.3, 7);

  // muted palette matching the Mainframe screenshot: warm greys/beiges
  const colBody = 0x8f8b82;     // blazer grey
  const colShirt = 0xe9e5dc;    // cream shirt
  const colHead = 0xcfc8ba;     // CRT casing beige
  const colScreen = 0x2b2a27;   // dark screen
  const colGlow = 0xf1ece0;     // soft eye glow

  const group = new THREE.Group();
  scene.add(group);

  // torso (rounded blazer)
  const torsoGeo = new THREE.CapsuleGeometry(1.05, 1.5, 8, 16);
  const torsoMat = new THREE.MeshStandardMaterial({ color: colBody, roughness: 0.9, metalness: 0.02 });
  const torso = new THREE.Mesh(torsoGeo, torsoMat);
  torso.position.y = -1.15;
  group.add(torso);

  // shirt collar hint
  const collarGeo = new THREE.ConeGeometry(0.5, 0.5, 4);
  const collarMat = new THREE.MeshStandardMaterial({ color: colShirt, roughness: 0.85 });
  const collar = new THREE.Mesh(collarGeo, collarMat);
  collar.position.y = -0.35;
  collar.rotation.y = Math.PI / 4;
  group.add(collar);

  // neck
  const neckGeo = new THREE.CylinderGeometry(0.28, 0.32, 0.4, 16);
  const neckMat = new THREE.MeshStandardMaterial({ color: colHead, roughness: 0.8 });
  const neck = new THREE.Mesh(neckGeo, neckMat);
  neck.position.y = 0.15;
  group.add(neck);

  // head group (the CRT monitor head), this part tracks the mouse
  const headGroup = new THREE.Group();
  headGroup.position.y = 0.85;
  group.add(headGroup);

  const headGeo = new THREE.BoxGeometry(1.5, 1.3, 1.3, 2, 2, 2);
  headGeo.translate(0, 0, 0);
  const headMat = new THREE.MeshStandardMaterial({ color: colHead, roughness: 0.75, metalness: 0.04 });
  const head = new THREE.Mesh(headGeo, headMat);
  headGroup.add(head);

  const screenGeo = new THREE.BoxGeometry(1.0, 0.78, 0.08);
  const screenMat = new THREE.MeshStandardMaterial({ color: colScreen, roughness: 0.5, metalness: 0.1 });
  const screen = new THREE.Mesh(screenGeo, screenMat);
  screen.position.set(0, 0.05, 0.68);
  headGroup.add(screen);

  const eyeGeo = new THREE.CircleGeometry(0.12, 24);
  const eyeMat = new THREE.MeshStandardMaterial({ color: colGlow, emissive: 0xd8cdb4, emissiveIntensity: 0.5, roughness: 0.3 });
  const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
  eyeL.position.set(-0.22, 0.05, 0.73);
  const eyeR = eyeL.clone();
  eyeR.position.x = 0.22;
  headGroup.add(eyeL, eyeR);

  const knobGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.04, 12);
  const knobMat = new THREE.MeshStandardMaterial({ color: 0x4a473f, roughness: 0.6 });
  const knob = new THREE.Mesh(knobGeo, knobMat);
  knob.rotation.x = Math.PI / 2;
  knob.position.set(0.55, -0.35, 0.68);
  headGroup.add(knob);

  // lights: warm neutral, soft
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const key = new THREE.DirectionalLight(0xfff3df, 0.9);
  key.position.set(3, 4, 5);
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xdad2c2, 0.35);
  fill.position.set(-4, -1, 2);
  scene.add(fill);

  let targetX = 0, targetY = 0, curX = 0, curY = 0;
  window.addEventListener('mousemove', (e) => {
    targetX = (e.clientX / window.innerWidth) * 2 - 1;
    targetY = (e.clientY / window.innerHeight) * 2 - 1;
  }, { passive: true });

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    curX += (targetX - curX) * 0.06;
    curY += (targetY - curY) * 0.06;

    headGroup.rotation.y = curX * 0.5;
    headGroup.rotation.x = -curY * 0.3;
    group.rotation.y = curX * 0.12;

    group.position.y = Math.sin(t * 1.1) * 0.06;

    renderer.render(scene, camera);
  }
  animate();
})();
</script>
